[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "slop-decisions"
version = "0.4.0"
description = "Evidence-grounded semantic code checks and reproducible Elixir evaluations"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{name = "Sam Havens"}]
dependencies = ["httpx>=0.27,<1"]
classifiers = ["Development Status :: 3 - Alpha", "Programming Language :: Python :: 3", "Topic :: Software Development :: Quality Assurance"]

[project.urls]
Repository = "https://github.com/samhavens/slop-decisions"

[project.scripts]
slop-decisions = "slop_decisions.cli:main"
slop-calibrate = "slop_decisions.calibration_study:main"

[dependency-groups]
dev = ["pytest>=8,<10", "ruff>=0.12,<1"]

[tool.uv]
# Preserve the dependency environment used for the published evaluation.
exclude-newer = "2026-03-22T07:59:37Z"

[tool.hatch.build.targets.wheel]
packages = ["src/slop_decisions"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
