name: CI
on: [push, pull_request]
permissions:
  contents: read
jobs:
  python:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.11', '3.13']
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: astral-sh/setup-uv@d0d8abe699bfb85fec6de9f7adb5ae17292296ff # v6
        with:
          python-version: ${{ matrix.python }}
          enable-cache: true
      - run: uv sync --locked
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run pytest -q
      - run: uv build
      - run: uv tool install --python ${{ matrix.python }} dist/*.whl
      - run: slop-decisions dataset --format json
      - run: slop-decisions check examples/slop_test.exs --dry-run --format json
  witnesses:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: astral-sh/setup-uv@d0d8abe699bfb85fec6de9f7adb5ae17292296ff # v6
        with:
          python-version: '3.13'
      - uses: erlef/setup-beam@0f75c29430f34bb5af4cce5e3b7f6a8860fca236 # v1
        with:
          otp-version: '27'
          elixir-version: '1.18'
      - run: uv sync --locked
      - run: uv run pytest -q tests/test_integration.py -k exunit
      - run: uv run pytest -q tests/test_skill.py -k phoenix
      - run: mix format --check-formatted examples/slop_test.exs
      - run: uv run slop-decisions fetch --format json
      - run: uv run python scripts/verify_reports.py
      - run: uv run python scripts/run_witnesses.py
      - run: uv run python scripts/verify_calibration.py
      - run: uv run python scripts/calibration_witnesses.py
